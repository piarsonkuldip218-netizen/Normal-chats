<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TAMS Dental — Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --teal: #0d9488; --teal-dark: #0f766e; --teal-light: #ccfbf1;
      --bg: #f0fdfa; --white: #ffffff; --gray: #6b7280; --gray-light: #f3f4f6;
      --border: #e5e7eb; --danger: #ef4444; --success: #10b981; --text: #111827;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: var(--white); border-radius: 20px; padding: 40px 32px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(13,148,136,0.15); }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo .icon { width: 70px; height: 70px; background: var(--teal); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 32px; }
    .login-logo h1 { font-size: 22px; font-weight: 700; }
    .login-logo p { font-size: 13px; color: var(--gray); margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--gray); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input { width: 100%; padding: 13px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 15px; font-family: inherit; outline: none; transition: border 0.2s; background: var(--gray-light); }
    .form-group input:focus { border-color: var(--teal); background: white; }
    .btn-primary { width: 100%; padding: 14px; background: var(--teal); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg { background: #fee2e2; color: var(--danger); padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-top: 12px; display: none; text-align: center; }

    #mainPanel { display: none; }
    .header { background: var(--white); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-icon { width: 38px; height: 38px; background: var(--teal); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .header h2 { font-size: 16px; font-weight: 700; }
    .header p { font-size: 12px; color: var(--gray); }
    .btn-logout { background: var(--gray-light); border: none; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-family: inherit; cursor: pointer; color: var(--gray); font-weight: 600; }

    .content { padding: 20px 16px; max-width: 600px; margin: 0 auto; }
    .section-label { font-size: 12px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { flex-shrink: 0; background: var(--white); border: 2px solid var(--border); border-radius: 50px; padding: 8px 16px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s; color: var(--gray); }
    .tab-btn.active { border-color: var(--teal); background: var(--teal); color: white; }

    .type-toggle { display: flex; gap: 8px; margin-bottom: 20px; }
    .type-btn { flex: 1; background: var(--white); border: 2px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s; color: var(--gray); text-align: center; }
    .type-btn.active { border-color: var(--teal); background: var(--teal-light); color: var(--teal-dark); }

    .upload-card { background: var(--white); border-radius: 20px; padding: 22px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .upload-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
    .drop-zone { border: 2.5px dashed var(--teal); border-radius: 14px; padding: 30px 16px; text-align: center; cursor: pointer; background: var(--bg); transition: background 0.2s; margin-bottom: 14px; }
    .drop-zone:hover { background: var(--teal-light); }
    .drop-zone .big-icon { font-size: 42px; margin-bottom: 8px; }
    .drop-zone p { font-size: 15px; color: var(--teal-dark); font-weight: 600; }
    .drop-zone span { font-size: 12px; color: var(--gray); }
    #fileInput { display: none; }
    .caption-input { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px; transition: border 0.2s; }
    .caption-input:focus { border-color: var(--teal); }

    #previewArea { display: none; margin-bottom: 14px; }
    #previewImg, #previewVideo { width: 100%; border-radius: 12px; max-height: 220px; object-fit: cover; display: block; }
    .preview-name { font-size: 12px; color: var(--gray); margin-top: 6px; text-align: center; }

    #progressBar { display: none; background: var(--gray-light); border-radius: 100px; height: 8px; margin-bottom: 12px; overflow: hidden; }
    #progressFill { height: 100%; background: var(--teal); border-radius: 100px; transition: width 0.4s; width: 0%; }

    #statusMsg { text-align: center; font-size: 14px; font-weight: 600; padding: 12px; border-radius: 10px; display: none; margin-bottom: 10px; }
    #statusMsg.success { background: #d1fae5; color: #065f46; }
    #statusMsg.error { background: #fee2e2; color: var(--danger); }

    .gallery-card { background: var(--white); border-radius: 20px; padding: 22px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .gallery-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
    #uploadedGrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .uploaded-item { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--gray-light); }
    .uploaded-item img { width: 100%; height: 100%; object-fit: cover; }
    .uploaded-item .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.5); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .empty-gallery { text-align: center; color: var(--gray); font-size: 13px; padding: 28px; grid-column: 1/-1; }
    .loading-spinner { text-align: center; color: var(--gray); font-size: 13px; padding: 20px; grid-column: 1/-1; }
    .grid-count { font-size: 12px; color: var(--gray); margin-bottom: 10px; }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">🦷</div>
      <h1>TAMS Dental</h1>
      <p>Admin Panel — Upload Photos & Videos</p>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="Password daalo" />
    </div>
    <button class="btn-primary" onclick="doLogin()">Login →</button>
    <div class="error-msg" id="loginError">❌ Wrong password. Dobara try karo.</div>
  </div>
</div>

<div id="mainPanel">
  <div class="header">
    <div class="header-left">
      <div class="header-icon">🦷</div>
      <div>
        <h2>TAMS Dental</h2>
        <p>Upload Panel</p>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="content">

    <div class="section-label">Section choose karo</div>
    <div class="tabs">
      <button class="tab-btn active" onclick="selectSection(this,'gallery')">🏥 Gallery</button>
      <button class="tab-btn" onclick="selectSection(this,'before-after')">😁 Before/After</button>
      <button class="tab-btn" onclick="selectSection(this,'team')">👨‍⚕️ Team</button>
      <button class="tab-btn" onclick="selectSection(this,'updates')">📢 Updates</button>
    </div>

    <div class="section-label">Type choose karo</div>
    <div class="type-toggle">
      <button class="type-btn active" id="typePhotoBtn" onclick="selectType('image')">📷 Photo</button>
      <button class="type-btn" id="typeVideoBtn" onclick="selectType('video')">🎥 Video</button>
    </div>

    <div class="upload-card">
      <h3>📤 Upload karo — <span id="sectionTitle">Gallery</span></h3>
      <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <div class="big-icon" id="dropIcon">📸</div>
        <p id="dropText">Photo choose karo</p>
        <span>Mobile gallery se select karo</span>
      </div>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)"/>
      <div id="previewArea">
        <img id="previewImg" src="" alt="Preview" style="display:none"/>
        <video id="previewVideo" controls style="display:none"></video>
        <p class="preview-name" id="previewName"></p>
      </div>
      <input type="text" class="caption-input" id="captionInput" placeholder="Caption (optional) — jaise: Smile Makeover Result"/>
      <div id="progressBar"><div id="progressFill"></div></div>
      <div id="statusMsg"></div>
      <button class="btn-primary" id="uploadBtn" onclick="uploadFile()" disabled>⬆️ Upload Karo</button>
    </div>

    <div class="gallery-card">
      <h3>🖼️ Uploaded Items</h3>
      <div class="grid-count" id="gridCount"></div>
      <div id="uploadedGrid"><div class="loading-spinner">⏳ Loading...</div></div>
    </div>

  </div>
</div>

<script>
  const CLOUD_NAME = "dqt43l0z8";
  const UPLOAD_PRESET = "tams_dental_admin";
  const PASSWORD = "Tams@2024";

  let selectedSection = "gallery";
  let selectedType = "image";
  let selectedFile = null;

  function doLogin() {
    const pwd = document.getElementById('passwordInput').value.trim();
    if (pwd === PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainPanel').style.display = 'block';
      loadItems();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  document.getElementById('passwordInput').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

  function logout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainPanel').style.display = 'none';
    document.getElementById('passwordInput').value = '';
    selectedFile = null;
  }

  function selectSection(btn, section) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedSection = section;
    const titles = { gallery:'Gallery', 'before-after':'Before/After', team:'Team', updates:'Updates' };
    document.getElementById('sectionTitle').textContent = titles[section];
    resetUpload();
    loadItems();
  }

  function selectType(type) {
    selectedType = type;
    document.getElementById('typePhotoBtn').classList.toggle('active', type === 'image');
    document.getElementById('typeVideoBtn').classList.toggle('active', type === 'video');
    document.getElementById('fileInput').accept = type === 'image' ? 'image/*' : 'video/*';
    document.getElementById('dropIcon').textContent = type === 'image' ? '📸' : '🎥';
    document.getElementById('dropText').textContent = type === 'image' ? 'Photo choose karo' : 'Video choose karo';
    resetUpload();
  }

  function resetUpload() {
    selectedFile = null;
    document.getElementById('previewArea').style.display = 'none';
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('previewVideo').style.display = 'none';
    document.getElementById('captionInput').value = '';
    document.getElementById('fileInput').value = '';
    document.getElementById('uploadBtn').disabled = true;
    document.getElementById('statusMsg').style.display = 'none';
  }

  function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    selectedFile = file;
    const url = URL.createObjectURL(file);

    if (selectedType === 'image') {
      const img = document.getElementById('previewImg');
      img.src = url;
      img.style.display = 'block';
      document.getElementById('previewVideo').style.display = 'none';
    } else {
      const vid = document.getElementById('previewVideo');
      vid.src = url;
      vid.style.display = 'block';
      document.getElementById('previewImg').style.display = 'none';
    }

    document.getElementById('previewName').textContent = file.name;
    document.getElementById('previewArea').style.display = 'block';
    document.getElementById('uploadBtn').disabled = false;
    document.getElementById('statusMsg').style.display = 'none';
  }

  async function uploadFile() {
    if (!selectedFile) return;
    const caption = document.getElementById('captionInput').value.trim();
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Uploading...';
    document.getElementById('progressBar').style.display = 'block';
    document.getElementById('progressFill').style.width = '20%';

    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('upload_preset', UPLOAD_PRESET);
    formData.append('folder', `tams-dental/${selectedSection}`);
    if (caption) formData.append('context', `caption=${caption}|alt=${caption}`);
    formData.append('tags', `tams-dental,${selectedSection}`);

    const endpoint = selectedType === 'image' ? 'image' : 'video';

    try {
      document.getElementById('progressFill').style.width = '60%';
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${endpoint}/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      document.getElementById('progressFill').style.width = '100%';

      if (data.secure_url) {
        showStatus('✅ Upload ho gaya! Website pe dikh rahega.', 'success');
        resetUpload();
        setTimeout(() => loadItems(), 1500);
      } else {
        showStatus('❌ Upload fail hua. Dobara try karo.', 'error');
      }
    } catch (err) {
      showStatus('❌ Internet check karo aur dobara try karo.', 'error');
    }

    btn.disabled = false;
    btn.textContent = '⬆️ Upload Karo';
    setTimeout(() => {
      document.getElementById('progressBar').style.display = 'none';
      document.getElementById('progressFill').style.width = '0%';
    }, 1000);
  }

  async function loadItems() {
    const grid = document.getElementById('uploadedGrid');
    const count = document.getElementById('gridCount');
    grid.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';
    count.textContent = '';

    try {
      const [imgRes, vidRes] = await Promise.all([
        fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/tams-dental:${selectedSection}.json`).then(r=>r.json()).catch(()=>({resources:[]})),
        fetch(`https://res.cloudinary.com/${CLOUD_NAME}/video/list/tams-dental:${selectedSection}.json`).then(r=>r.json()).catch(()=>({resources:[]}))
      ]);

      const images = (imgRes.resources||[]).map(r=>({...r, type:'image'}));
      const videos = (vidRes.resources||[]).map(r=>({...r, type:'video'}));
      const items = [...images, ...videos];

      if (items.length === 0) {
        grid.innerHTML = '<div class="empty-gallery">📷 Abhi kuch upload nahi hua — pehla item upload karo!</div>';
        count.textContent = '';
        return;
      }

      items.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      count.textContent = `${items.length} item${items.length > 1 ? 's' : ''} uploaded`;
      grid.innerHTML = '';

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'uploaded-item';
        if (item.type === 'video') {
          const thumb = `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/w_300,h_300,c_fill,q_auto/${item.public_id}.jpg`;
          div.innerHTML = `<img src="${thumb}" loading="lazy"/><div class="play-icon">▶</div>`;
        } else {
          const url = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/w_300,h_300,c_fill,q_auto/${item.public_id}`;
          div.innerHTML = `<img src="${url}" loading="lazy"/>`;
        }
        grid.appendChild(div);
      });
    } catch (e) {
      grid.innerHTML = '<div class="empty-gallery">Items load nahi hue. Internet check karo.</div>';
    }
  }

  function showStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = type;
    el.style.display = 'block';
    if (type === 'success') setTimeout(() => el.style.display = 'none', 5000);
  }
</script>
</body>
</html>
